name: Bug report
description: Report a broken link, build error, or display issue on the site
labels: bug
body:
  - type: textarea
    id: report
    attributes:
      label: What's broken
      description: Describe the issue and where on the site it occurs (page URL if applicable).
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The scvi-tools.org page where you saw the problem, if applicable.
      placeholder: https://scvi-tools.org/...

  - type: textarea
    id: environment
    attributes:
      label: Browser / environment
      description: Browser and OS, if relevant (e.g. layout or rendering issues).
